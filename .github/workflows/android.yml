# Compila la app de Vento para Android (APK) y la publica en la página de descargas del repositorio:
#   https://github.com/cristhianlujan45-blip/cuentas/releases/latest/download/vento.apk
# Corre sola cada vez que cambia la carpeta android/ en la rama principal, y también a mano
# (Actions → App Android → Run workflow).
name: App Android

on:
  workflow_dispatch:
  push:
    branches: [claude/precio-margen-productos-tabla-mioclt]
    paths: ['android/**', '.github/workflows/android.yml']

permissions:
  contents: write

concurrency:
  group: app-android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VENTO_VERSION_CODE: ${{ github.run_number }}
      VENTO_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar el APK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          gradle -p android assembleRelease --no-daemon --stacktrace
          cp android/app/build/outputs/apk/release/app-release.apk vento.apk
          ls -la vento.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vento-apk
          path: vento.apk
      - name: Publicar en Descargas (release «android»)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTAS="Vento para Android ${VENTO_VERSION_NAME}. Descarga vento.apk, ábrelo en el celular y toca Instalar (si pregunta, permite instalar apps de esta fuente). Las versiones nuevas se instalan encima sin borrar nada."
          if gh release view android >/dev/null 2>&1; then
            gh release edit android --title "Vento para Android ${VENTO_VERSION_NAME}" --notes "$NOTAS" --latest
          else
            gh release create android --title "Vento para Android ${VENTO_VERSION_NAME}" --notes "$NOTAS" --target "${GITHUB_SHA}" --latest
          fi
          gh release upload android vento.apk --clobber
          echo "### ✅ APK publicado: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/vento.apk" >> "$GITHUB_STEP_SUMMARY"
