plugins {
    id 'com.android.application'
}

// Vento Admin: la app del proveedor (abre admin.html). Misma firma y mismo número de versión que Vento.
def codigo = (System.getenv('VENTO_VERSION_CODE') ?: '1') as int
def nombre = System.getenv('VENTO_VERSION_NAME') ?: '1.0'

android {
    namespace 'co.vento.admin'
    compileSdk 34

    defaultConfig {
        applicationId 'co.vento.admin'
        minSdk 24
        targetSdk 34
        versionCode codigo
        versionName nombre
    }

    signingConfigs {
        release {
            // La llave NO va en el repositorio (es público). En GitHub Actions se arma desde los secretos
            // VENTO_KEYSTORE_B64 y VENTO_KS_PASS (ver android/LEEME.md → Firma). Sin ellos se firma con la
            // llave de depuración y el flujo NO publica el APK.
            def ks = System.getenv('VENTO_KS_FILE') ?: '../vento-apk.jks'
            if (file(ks).exists() && System.getenv('VENTO_KS_PASS')) {
                storeFile file(ks)
                storePassword System.getenv('VENTO_KS_PASS')
                keyAlias System.getenv('VENTO_KS_ALIAS') ?: 'vento'
                keyPassword System.getenv('VENTO_KS_KEY_PASS') ?: System.getenv('VENTO_KS_PASS')
            } else {
                storeFile new File(System.getProperty('user.home'), '.android/debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
