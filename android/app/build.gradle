plugins {
    id 'com.android.application'
}

// Versión: el número de compilación sale de GitHub Actions (cada compilación sube 1, así el
// celular acepta la actualización encima de la anterior sin borrar nada).
def codigo = (System.getenv('VENTO_VERSION_CODE') ?: '1') as int
def nombre = System.getenv('VENTO_VERSION_NAME') ?: '1.0'

android {
    namespace 'co.vento.app'
    compileSdk 34

    defaultConfig {
        applicationId 'co.vento.app'
        minSdk 24
        targetSdk 34
        versionCode codigo
        versionName nombre
    }

    signingConfigs {
        release {
            // Firma de la app para instalar fuera de la Play Store. Siempre la misma, así cada
            // versión nueva se instala encima de la anterior. Para la Play Store se usa la firma de Google.
            // La llave NO va en el repositorio (es público). En GitHub Actions se arma desde los secretos
            // VENTO_KEYSTORE_B64 y VENTO_KS_PASS (ver android/LEEME.md → Firma). Sin ellos se firma con la
            // llave de depuración y el flujo NO publica el APK.
            def ks = System.getenv('VENTO_KS_FILE') ?: '../vento-apk.jks'
            if (file(ks).exists() && System.getenv('VENTO_KS_PASS')) {
                storeFile file(ks)
                storePassword System.getenv('VENTO_KS_PASS')
                keyAlias System.getenv('VENTO_KS_ALIAS') ?: 'vento'
                keyPassword System.getenv('VENTO_KS_KEY_PASS') ?: System.getenv('VENTO_KS_PASS')
            } else {
                storeFile new File(System.getProperty('user.home'), '.android/debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Buscar los Chromecast / Google TV igual que la app de YouTube (Google Play Services).
    implementation 'androidx.mediarouter:mediarouter:1.7.0'
    implementation 'com.google.android.gms:play-services-cast:21.5.0'
}
