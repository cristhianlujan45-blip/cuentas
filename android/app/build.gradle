plugins {
    id 'com.android.application'
}

// Versión: el número de compilación sale de GitHub Actions (cada compilación sube 1, así el
// celular acepta la actualización encima de la anterior sin borrar nada).
def codigo = (System.getenv('VENTO_VERSION_CODE') ?: '1') as int
def nombre = System.getenv('VENTO_VERSION_NAME') ?: '1.0'

android {
    namespace 'co.vento.app'
    compileSdk 34

    defaultConfig {
        applicationId 'co.vento.app'
        minSdk 24
        targetSdk 34
        versionCode codigo
        versionName nombre
    }

    signingConfigs {
        release {
            // Firma de la app para instalar fuera de la Play Store. Siempre la misma, así cada
            // versión nueva se instala encima de la anterior. Para la Play Store se usa la firma de Google.
            storeFile file('../vento-apk.jks')
            storePassword System.getenv('VENTO_KS_PASS') ?: 'vento-apk-2026'
            keyAlias 'vento'
            keyPassword System.getenv('VENTO_KS_PASS') ?: 'vento-apk-2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
